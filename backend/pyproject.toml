[project]
name = "razi-backend"
version = "0.1.0"
description = "بک‌اند سامانه جامع بیمارستان بین‌المللی ولیعصر تبریز"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "psycopg[binary]==3.2.3",
    "pydantic-settings==2.7.0",
    "argon2-cffi==23.1.0",
    "pyjwt==2.10.1",
    "cryptography==44.0.0",
    # ترجمه ماشینی (app/services/machine_translation.py)
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "ruff==0.8.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["data/*.json", "admin_web/*", "admin_web/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]
